# Nixpacks build config for Railway (backend service, Root Directory = backend).
# Ensures a Python toolchain (with pip) is provisioned before installing deps,
# which fixes the 'sh: 1: pip: not found' error seen with a custom buildCommand.
providers = ["python"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port ${PORT:-8000}"
